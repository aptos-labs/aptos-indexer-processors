name: Copy images to dockerhub on release
on:
  push:
    tags:
      - aptos-indexer-processors-v*

permissions:
  contents: read
  id-token: write #required for GCP Workload Identity federation

jobs:
  copy-images-to-docker-hub:
    strategy:
      matrix:
        language: ["rust"]
    uses: ./.github/workflows/copy-processor-images-to-dockerhub.yaml
    with:
      processor_language: ${{ matrix.language }}
      version_tag: ${{ github.ref_name }}
      GIT_SHA: ${{ github.sha }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      ENV_DOCKERHUB_USERNAME: ${{ secrets.ENV_DOCKERHUB_USERNAME }}
      ENV_DOCKERHUB_PASSWORD: ${{ secrets.ENV_DOCKERHUB_PASSWORD }}
